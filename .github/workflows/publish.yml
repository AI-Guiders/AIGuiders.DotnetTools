name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        run: dotnet pack dotnet-tools/AIGuiders.DotnetTools.PublishFixedTarget/AIGuiders.DotnetTools.PublishFixedTarget.csproj -c Release

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: LonelySoul

      - name: Push to nuget.org
        run: |
          dotnet nuget push "dotnet-tools/**/bin/Release/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate


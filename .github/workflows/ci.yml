name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AIGuiders.DotnetTools.sln

      - name: Build
        run: dotnet build AIGuiders.DotnetTools.sln -c Release --no-restore

      - name: Sample TomlCheck
        run: |
          dotnet run --project AIGuiders.DotnetTools.TomlCheck/AIGuiders.DotnetTools.TomlCheck.csproj -- \
            check samples/
